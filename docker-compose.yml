services:
  postgres:
    image: postgres:16
    container_name: encore-postgres
    # 300, not the default 100. Npgsql pools per connection string and a host's five
    # module strings are identical, so each host is one pool: 100 for the monolith, 50 for
    # payments-api, plus 100 more for a host when HOLD_CAP_LOCK=Postgres gives the advisory
    # lock its own data source (005). The rest is headroom for the chaos rig's psql, a
    # `dotnet run` and the Testcontainers suites. At the default, the strangled pair alone overran the server
    # with `53300: too many clients` (019).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore
      POSTGRES_DB: encore
    # 55432 on the host: a native PostgreSQL 18 service owns 5432 on the development
    # machine, and `docker ps` still shows the mapping as Docker's. Container-to-container
    # paths use 5432 and are unaffected (020).
    ports:
      - "55432:5432"
    volumes:
      - encore-postgres-data:/var/lib/postgresql/data
    # So `up --wait` means ready rather than started, and a first migration does not race
    # an initialising Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore -d encore"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    container_name: encore-redis
    ports:
      - "6379:6379"
    # No volume: Redis holds only short-lived locks.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The monolith, containerised for the load harness. Behind a profile so a bare
  # `docker compose up -d` stays "just the dependencies". The migrators run before Kestrel
  # opens, so this waits for healthy dependencies. Production environment on purpose: a
  # measurement should not include the developer exception page.
  api:
    profiles: ["load"]
    build:
      context: .
      dockerfile: src/Encore.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # One string per module even though they name one database: the names are the
      # extraction seam.
      ConnectionStrings__Catalog: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Orders: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Inventory: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Redis: "redis:6379"
      # Run profiles are the only place migrate-on-startup is set (017).
      Catalog__MigrateOnStartup: "true"
      Orders__MigrateOnStartup: "true"
      Inventory__MigrateOnStartup: "true"
      Payments__MigrateOnStartup: "true"
      Notifications__MigrateOnStartup: "true"
      # The background workloads can each be switched off so a run can price them (019).
      # The outbox drain has no flag: it is atomic with the seat write, and turning it off
      # would be a different system. SWEEP_ENABLED=false also asks 006's question under
      # load: the sale must still sell every seat and oversell none.
      Inventory__Outbox__Enabled: "${OUTBOX_ENABLED:-true}"
      Inventory__ExpiredHoldSweep__Enabled: "${SWEEP_ENABLED:-true}"
      Payments__Reconciliation__Enabled: "${RECONCILER_ENABLED:-true}"
      # Overridden only by the chaos rig, to see whether the per-lock cost of a Redis
      # outage moves with it (019).
      Inventory__RedisLock__ConnectTimeoutMs: "${REDIS_CONNECT_TIMEOUT_MS:-1000}"
      # How long the lock stops asking Redis after a refusal. 00:00:00 asks every time: the
      # control for measuring what the cooldown saves (019).
      Inventory__RedisLock__Cooldown: "${REDIS_LOCK_COOLDOWN:-00:00:01}"
      # Who serialises the hold cap's count: Redis, or a Postgres advisory lock (005).
      Inventory__HoldCapLock: "${HOLD_CAP_LOCK:-Redis}"
      # Telemetry is off unless this names a collector, so a load run measures the system
      # without it. OTEL_ENDPOINT=http://lgtm:4317 with `--profile telemetry` turns it on (021).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT:-}"

  # Payments as its own process (018). Behind the `strangled` profile so the monolith's
  # workflow is unchanged. Same `payments` schema in the same database: the process
  # boundary moved, the data boundary has not.
  payments-api:
    profiles: ["strangled"]
    build:
      context: .
      dockerfile: src/Encore.Payments.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=50"
      Payments__MigrateOnStartup: "true"
      # A local development token, checked in so `up` works. Not a secret; a deployment
      # supplies its own.
      Payments__ServiceToken: "${PAYMENTS_SERVICE_TOKEN:-local-development-token}"
      # This process owns the reconciler; `api-strangled` turns its own off (014).
      Payments__Reconciliation__Enabled: "true"
      # Chaos-rig knobs. MinimumAge is one hold duration so a sweep does not race a confirm
      # that could still succeed; a run is minutes long, so the rig lowers it to watch
      # reconciliation happen.
      Payments__Reconciliation__MinimumAge: "${RECONCILER_MIN_AGE:-00:05:00}"
      Payments__Reconciliation__PollInterval: "${RECONCILER_POLL:-00:01:00}"
      # Debug only under the chaos rig: the reconciler logs a lost xmin race at Debug.
      Logging__LogLevel__Encore: "${ENCORE_LOG_LEVEL:-Information}"
      # Timeouts are off by default, so the baseline measures the happy path. The chaos rig
      # raises the rate to produce TimedOut rows for reconciliation to settle.
      Payments__Simulation__TimeoutRate: "${PAYMENTS_TIMEOUT_RATE:-0}"
      Payments__Simulation__LostRequestRate: "${PAYMENTS_LOST_REQUEST_RATE:-0.5}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT:-}"

  # The monolith with Payments cut out: same image as `api`, different configuration, so
  # the two arrangements can run side by side.
  api-strangled:
    profiles: ["strangled"]
    build:
      context: .
      dockerfile: src/Encore.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payments-api:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Catalog: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Orders: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Inventory: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=encore;Username=encore;Password=encore;Maximum Pool Size=100"
      ConnectionStrings__Redis: "redis:6379"
      Catalog__MigrateOnStartup: "true"
      Orders__MigrateOnStartup: "true"
      Inventory__MigrateOnStartup: "true"
      Payments__MigrateOnStartup: "false"
      Notifications__MigrateOnStartup: "true"
      Inventory__Outbox__Enabled: "${OUTBOX_ENABLED:-true}"
      Inventory__ExpiredHoldSweep__Enabled: "${SWEEP_ENABLED:-true}"
      # The strangling: Orders resolves HttpOrderPayments when a base address is set.
      Orders__Payments__BaseAddress: "http://payments-api:8080/internal/payments"
      Orders__Payments__ServiceToken: "${PAYMENTS_SERVICE_TOKEN:-local-development-token}"
      # Off: payments-api owns the reconciler. RECONCILER_EVERYWHERE=true runs two sweeps
      # over one table so the chaos rig can test the advisory lock that arbitrates them
      # (014). The lock is the guard, not the plan; do not set it outside the rig.
      Payments__Reconciliation__Enabled: "${RECONCILER_EVERYWHERE:-false}"
      Payments__Reconciliation__MinimumAge: "${RECONCILER_MIN_AGE:-00:05:00}"
      Payments__Reconciliation__PollInterval: "${RECONCILER_POLL:-00:01:00}"
      Logging__LogLevel__Encore: "${ENCORE_LOG_LEVEL:-Information}"
      Inventory__RedisLock__ConnectTimeoutMs: "${REDIS_CONNECT_TIMEOUT_MS:-1000}"
      Inventory__RedisLock__Cooldown: "${REDIS_LOCK_COOLDOWN:-00:00:01}"
      Inventory__HoldCapLock: "${HOLD_CAP_LOCK:-Redis}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT:-}"

  # Grafana, Tempo, Prometheus and Loki in one container, behind its own profile so nothing
  # else starts it. Receives OTLP on 4317 (gRPC) and 4318 (HTTP); Grafana on 3000, anonymous
  # admin. No volume: a session's telemetry is for looking at, not for keeping (021).
  lgtm:
    profiles: ["telemetry"]
    image: grafana/otel-lgtm:0.33.1
    container_name: encore-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    # The "Encore — flash sale" dashboard, provisioned beside the image's own.
    volumes:
      - ./ops/grafana/provisioning/encore.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/encore.yaml:ro
      - ./ops/grafana/dashboards:/otel-lgtm/encore-dashboards:ro

  # The load harness: k6 in a container, so the rig adds no project and no package the
  # build rules would have to reason about (019). `--build` is required, as for `tests`:
  # without it the run measures the previous api image, and a stale baseline misattributes
  # every later change. The tag is pinned so the rig does not change between runs.
  load:
    profiles: ["load"]
    image: grafana/k6:2.2.0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./load:/scripts:ro
      # One summary per run. Gitignored: one machine on one day is not a claim.
      - ./load/results:/results
    environment:
      ENCORE_BASE_URL: "http://api:8080"
    # Knobs are environment variables because k6 ignores --vus and --duration when a
    # script defines scenarios:
    #   docker compose run --rm --build -e CONTENTION_VUS=200 load
    entrypoint: ["k6", "run", "/scripts/flash-sale.js"]

  # The same rig against the strangled pair. A second service because `depends_on`
  # cannot be templated. Same script and defaults, so its numbers compare with `load`'s.
  load-strangled:
    profiles: ["strangled"]
    image: grafana/k6:2.2.0
    depends_on:
      api-strangled:
        condition: service_healthy
      payments-api:
        condition: service_healthy
    volumes:
      - ./load:/scripts:ro
      - ./load/results:/results
    environment:
      ENCORE_BASE_URL: "http://api-strangled:8080"
    entrypoint: ["k6", "run", "/scripts/flash-sale.js"]

  # The test suite, on Linux because Smart App Control blocks freshly built assemblies on
  # the host (020). It does not depend on the services above: the integration tests start
  # their own throwaway instances, so a run never touches the database in use by hand.
  tests:
    profiles: ["tests"]
    # Named, so CI can build it with a layer cache and run exactly that image.
    image: encore-tests:latest
    build:
      context: .
      dockerfile: tests/Dockerfile
    volumes:
      # Testcontainers start as siblings on the host's daemon, not Docker-in-Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Sibling containers publish on the host, so "localhost" here would be wrong.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      # Docker Desktop defines this name; declaring it keeps plain Linux working.
      - "host.docker.internal:host-gateway"

volumes:
  encore-postgres-data:
