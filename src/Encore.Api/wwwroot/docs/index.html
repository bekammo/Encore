<!DOCTYPE html>
<!--
  Swagger UI over Encore's OpenAPI document.

  Served by the host itself, from wwwroot, which is what makes "Try it out"
  work: the page and the API share an origin, so no CORS policy is needed and
  none exists. Opening this file straight off disk instead would put the page on
  a null origin and every request from it would be refused.

  The UI assets come from a CDN rather than from this repo. They are a
  development convenience, not part of the product, and vendoring ~3MB of
  minified JavaScript into a repo that argues about dependency discipline would
  be the wrong trade. The consequence, stated plainly: /docs/ needs a network
  connection, and the API does not.

  DECISIONS 014 refused Swashbuckle and Microsoft.AspNetCore.OpenApi because
  Encore.Api holds zero PackageReference items on purpose. Nothing here changes
  that — a script tag is not a NuGet package, and the build rule ENCORE001 still
  passes. What it does mean is that docs/openapi.json is written by hand and
  nothing regenerates it, which 049 records as the cost.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encore API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .swagger-ui .info { margin: 24px 0; }
  </style>
</head>
<body>
  <div id="swagger"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      // Cache-busted deliberately. The static files middleware serves this with an
      // ETag, but a browser is free to reuse a fresh-enough copy without asking,
      // and it does — which means editing openapi.json and reloading shows the
      // previous document with no indication that is what you are looking at. A
      // 24KB refetch costs nothing next to debugging a document that is already
      // correct on disk.
      url: './openapi.json?v=' + Date.now(),
      dom_id: '#swagger',
      deepLinking: true,
      docExpansion: 'list',
      defaultModelsExpandDepth: 0,
      tryItOutEnabled: true,
      persistAuthorization: true,
      presets: [SwaggerUIBundle.presets.apis]
    });
  </script>
</body>
</html>
