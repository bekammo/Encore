# Runs the test suite on pull requests and pushes to main.
name: tests

on:
  # Not a wildcard push trigger: with both, every commit on a PR branch would run twice.
  # workflow_dispatch covers a branch with no PR.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The image is built first, with its layers cached between runs, so the restore layer
      # is reused whenever no project file changed. The container copies each test project by
      # name, so a project missing from tests/Dockerfile fails here, as it does locally.
      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          tags: encore-tests:latest
          load: true
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests

      # The documented command, on the image just built. Locally, --build does the building.
      - name: Run the suite
        id: suite
        run: |
          set -uo pipefail
          docker compose run --rm tests 2>&1 | tee suite.log
          echo "compose exit: ${PIPESTATUS[0]}"

      # `docker compose run` exits 0 even when the daemon is unreachable, so the verdict
      # comes from the per-assembly `Passed!` lines instead of the exit code.
      - name: Check the summary lines, not the exit code
        run: |
          set -uo pipefail

          expected=$(find tests -name '*.csproj' | wc -l)
          passed=$(grep -c '^Passed!' suite.log || true)
          failed=$(grep -c '^Failed!' suite.log || true)

          echo "test projects in the tree: $expected"
          echo "assemblies reporting Passed!: $passed"
          echo "assemblies reporting Failed!: $failed"

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed test assemblies failed."
            grep '^Failed!' suite.log
            exit 1
          fi

          # Fails when nothing ran, and when a test project never reached the runner.
          if [ "$passed" -ne "$expected" ]; then
            echo "::error::Expected $expected test assemblies to report, got $passed. A project in tests/ did not run — check Encore.sln and tests/Dockerfile."
            exit 1
          fi

          echo "All $passed test assemblies passed."

      # Keep the log as evidence.
      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: suite.log
          retention-days: 14

  # Whitespace only, by folder, so it needs no restore. The style rules in .editorconfig are
  # suggestions and the build enforces the rest; migrations are marked generated and skipped.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check whitespace formatting
        run: dotnet format whitespace . --folder --verify-no-changes --verbosity normal
